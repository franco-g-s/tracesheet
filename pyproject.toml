[project]
name = "tracesheet"
version = "0.1.0"
description = "Traceable company evaluation sheets built from annual-report figures."
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "Franco Gómez Schumacher" }]
dependencies = [
    "jinja2>=3",
    "pydantic>=2",
]

[project.scripts]
tracesheet = "tracesheet.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracesheet"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Broad by intent: this is financial software, and every silent bug class ruff can catch
# is one fewer to catch by eye. Relax a rule only with a comment saying why.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no stray print()
    "SIM",       # simplify
    "RET",       # return consistency
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # no commented-out code
    "PL",        # pylint subset
    "RUF",       # ruff's own
]
ignore = [
    "PLR2004",   # magic-value comparisons; tests compare literals
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913", "ARG"]
"src/tracesheet/cli.py" = ["T201"]   # a command line talks through print
# Formulas and figures are reader-facing text, typeset with true minus, multiplication and
# dash signs.
"src/tracesheet/metrics/{catalogue,docs}.py" = ["RUF001"]
"src/tracesheet/report/*.py" = ["RUF001", "RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
xfail_strict = true
